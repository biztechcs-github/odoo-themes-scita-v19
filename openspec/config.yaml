# # -----------------------------------------------------------------------------
# # spec-driven-ui  |  Project custom  |  wireframe → proposal → design → specs → tasks
# # Wireframe-first flow for any user-facing screen, interaction, or visible flow.
# # Spec is written against the signed-off wireframe — not before it.
# # Best for: internal product features that have a UI component.
# # -----------------------------------------------------------------------------
# schema: spec-driven-ui
# # rules:
# #   wireframe:
# #     - Wireframe MUST be signed off by the BA and stakeholder before proposal is written.
# #     - Add a ~15-minute tech feasibility glance for any custom client wireframe.
# #   proposal:
# #     - Must use adversarial-authoring skill
# #     - The Impact Scope table is MANDATORY — search for every controller, view,
# #       partial, shared component, and route this change touches.
# #     - Verify all domain and technical terms against glossary/business.md.
# #   specs:
# #     - Must use gherkin-authoring skill
# #     - Every scenario MUST reference the wireframe screen ID it covers (sc1, sc2...).
# #   design:
# #     - Must use adversarial-authoring skill
# #     - Must use security-review skill
# #     - Security Considerations section is required in design.md
# #     - Wireframe Deviations section is required — state "None" if there are none.

# # -----------------------------------------------------------------------------
# # greenfield-bootstrap  |  Project custom  |  scaffold → specs → design → tasks
# # Scaffold-first flow for brand-new projects with no existing codebase.
# # Locks in tech stack and project structure before writing any code.
# # Best for: starting a new application or service from scratch.
# # -----------------------------------------------------------------------------
# schema: greenfield-bootstrap
# # rules:
# #   scaffold:
# #     - Must use adversarial-authoring skill
# #     - Tech stack decisions MUST include rationale and rejected alternatives
# #       for each layer (frontend, backend, database, auth, hosting, CI/CD, testing).
# #     - Domain concepts listed here become the seed for glossary/business.md.
# #   specs:
# #     - Must use gherkin-authoring skill
# #   design:
# #     - Must use adversarial-authoring skill
# #     - Must use security-review skill
# #     - Security Considerations section is required in design.md
# #   tasks:
# #     - Tasks MUST be ordered: init → bootstrap → database → auth → capabilities → verification.

# # -----------------------------------------------------------------------------
# # bespoke-discovery  |  Project custom  |  wireframe → proposal/SOW → design → specs → tasks
# # Discovery-first flow for bespoke/custom client projects.
# # Proposal doubles as the SOW — customer signs off before any code is written.
# # Best for: new client engagements where scope must be externally agreed.
# # -----------------------------------------------------------------------------
# schema: bespoke-discovery
# # rules:
# #   wireframe:
# #     - Wireframe MUST be signed off by the customer before the SOW is written.
# #     - Add a tech feasibility glance before presenting the wireframe to the customer.
# #   proposal:
# #     - Must use adversarial-authoring skill
# #     - Scope — Out section is REQUIRED. Omitting it is the #1 cause of scope creep.
# #     - Acceptance Criteria must align with Gherkin scenarios (same criteria, two formats).
# #     - Verify all domain and technical terms against glossary/business.md.
# #   specs:
# #     - Must use gherkin-authoring skill
# #     - Every scenario MUST be readable by the customer (no internal jargon).
# #     - Every scenario MUST map to a customer-facing acceptance criterion in the SOW.
# #   design:
# #     - Must use adversarial-authoring skill
# #     - Must use security-review skill
# #     - Security Considerations section is required in design.md
# #     - Risk Register and Change Request Triggers sections are required.
# #   tasks:
# #     - Group tasks by deliverable / sprint, not just technical layer.
# #     - Flag tasks that depend on external input (customer data, API credentials).
# #     - The Verification DoD group MUST include customer UAT checklist readiness.

