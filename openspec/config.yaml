context: |
  Tech stack: Odoo 19 addon module (Python/Odoo ORM backend, QWeb/XML views, SCSS, JavaScript frontend) — Theme Scita, a multipurpose eCommerce/CMS website theme
  Language: Python (models/controllers), XML/QWeb (views/templates), SCSS (styles), JavaScript (frontend widgets)
  App root: theme_scita/
  Naming: snake_case Python files, functions and fields; dot-separated snake_case Odoo model names (e.g. banner.image, image.hotspot); PascalCase Python model classes
  Commits: loose type-prefix style, inconsistent casing/brackets (e.g. [FIX]:, [ADD]:, fix:, Add:) — not strict conventional commits
  Domain: Odoo eCommerce/CMS website theme (snippets, banners, sliders, deals, product comparison, PWA, quote requests) for Odoo 19, built by AppJetty
  Dev server: not configured (no .claude/launch.json found in repo)
  Runtime gate: not configured — depends on the Odoo dev server host/port once .claude/launch.json is set up (module install/upgrade succeeds + zero console errors on affected pages)

