# # -----------------------------------------------------------------------------
# # spec-driven  |  Vendor built-in  |  proposal → specs + design → tasks
# # Standard workhorse. No ADR step. Use when no durable arch decisions expected.
# # -----------------------------------------------------------------------------
# schema: spec-driven
# # rules:
# #   proposal:
# #     - Must use adversarial-authoring skill
# #   specs:
# #     - Must use gherkin-authoring skill
# #   design:
# #     - Must use adversarial-authoring skill
# #     - Must use security-review skill
# #     - Security Considerations section is required in design.md

# # -----------------------------------------------------------------------------
# # intent-driven  |  Project custom  |  proposal → specs + design → adr → tasks
# # Full workflow: Gherkin specs, grill-me interview, C4 diagrams, ADR tracking.
# # Best for: feature work where requirements need clarifying before coding.
# # -----------------------------------------------------------------------------
# schema: intent-driven
# rules:
#   proposal:
#     - Before writing the proposal, search the full codebase for every instance of
#       the affected component, pattern, data field, route, or shared UI element.
#       Populate the "Impact Scope" table in proposal.md with every affected location.
#       The proposal is incomplete if any location is missing.
#     - Must use grill-me skill
#     - Must use adversarial-authoring skill
#     - Verify all domain and technical terms against glossary/business.md and
#       glossary/technical.md. Use the exact term defined there; do not introduce synonyms.
#     - >-
#       WIREFRAME (UI work only): If a wireframe file or path is provided by the user,
#       read it in full before writing the proposal. The proposal must include a
#       "Wireframe Reference" line naming the file and confirm the wireframe is
#       signed off. Do not start the proposal without a signed-off wireframe for
#       any change that introduces or modifies a visible screen or user interaction.
#   specs:
#     - Must use gherkin-authoring skill
#     - Verify all domain and technical terms against glossary/business.md and
#       glossary/technical.md before writing scenarios.
#     - >-
#       WIREFRAME (UI work only): If a wireframe was provided for this change,
#       every scenario that covers a visible screen or interaction MUST reference
#       the wireframe screen ID it covers (e.g. sc1, sc2). A scenario with no
#       screen reference for a UI change is incomplete.
#   design:
#     - Must use c4-diagrams skill
#     - Must use security-review skill
#     - Security Considerations section is required in design.md
#     - >-
#       WIREFRAME (UI work only): If a wireframe was provided, include a
#       "Wireframe Deviations" section — state "None" if the implementation
#       follows the wireframe exactly.
#   adr:
#     - Must use architectural-decision-records skill
#   tasks:
#     - Read engineering-guidelines.md (repo root) at the start of every apply session.
#     - After implementing each task group, run the build and all tests. Do not proceed
#       to the next task group until the build is clean and all tests pass.
#     - >-
#       If a runtime error occurs during apply: fix it, then append ONE line to
#       engineering-guidelines.md in the format:
#       "Pattern: <what caused it> → Fix: <what prevents it>".
#     - Every acceptance-criteria scenario in the specs MUST have a matching automated
#       test task.
#     - The task list MUST end with a "Verification — Definition of Done" group
#       requiring all tests green and the build passing before verifying or archiving.
#     - Do NOT mark a verification/test task complete unless the test actually exists
#       and passes. A ticked box with no test is a failed gate, not a pass.
#     - Production code MUST NOT contain TODO, FIXME, mock, or placeholder markers.
#       Verify scans for these and treats any match as a CRITICAL failure blocking archive.
#     - If the change includes Gherkin scenarios (.feature files), include a step-definition
#       implementation task for each scenario file before any implementation tasks. Scenarios
#       without matching step definitions are documentation only — not executable tests.

