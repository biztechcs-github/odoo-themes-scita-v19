asyncapi: 3.0.0
info:
  title: <service-or-domain-name>
  version: 0.1.0
  description: >
    AsyncAPI spec derived from event-storming and design artifacts.
    Run `asyncapi-cli validate asyncapi.yaml` before marking this artifact done.

servers:
  broker:
    host: <broker-host>
    protocol: <kafka|nats|amqp|mqtt|ws>

channels:
  <domain.event.v1>:
    address: <domain.event.v1>
    messages:
      <MessageName>:
        $ref: '#/components/messages/<MessageName>'

operations:
  publish<MessageName>:
    action: send
    channel:
      $ref: '#/channels/<domain.event.v1>'
    messages:
      - $ref: '#/channels/<domain.event.v1>/messages/<MessageName>'

components:
  messages:
    <MessageName>:
      name: <MessageName>
      payload:
        $ref: '#/components/schemas/<MessagePayload>'
  schemas:
    <MessagePayload>:
      type: object
      required:
        - id
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        # add domain-specific fields here
  securitySchemes: {}
