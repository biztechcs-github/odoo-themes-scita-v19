name: bespoke-proposal
version: 1
description: >
  Lighter bespoke flow for client projects where scope is already well-understood.
  Lifecycle: proposal/SOW → design → specs → tasks.
  No separate discovery or wireframe phase — use when the client brief is clear
  and a detailed wireframe is not needed before scoping.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Proposal / Scope of Work for a well-scoped bespoke engagement
    template: proposal.md
    instruction: >
      Write the proposal document. This serves as both the internal proposal
      and the Scope of Work (SOW) shared with the customer.

      Use this schema when you already have a clear brief and do not need a
      wireframe iteration cycle before writing scope. If the UI is significant
      and the customer needs to see screens before approving scope, use
      `bespoke-discovery` instead.

      Sections:

      - **Project Summary**: One paragraph — what the customer commissioned
        and what the outcome will be.

      - **Why**: The customer's business problem or opportunity.

      - **Scope — In**: Bulleted list of everything included. Be specific —
        vague scope breeds disputes on fixed-price work.

      - **Scope — Out**: Explicitly list what is NOT included. Required.

      - **Capabilities**: Kebab-case names for each feature being built.
        Each becomes a `specs/<name>/spec.md`.

      - **Deliverables**: What the customer receives.

      - **Acceptance Criteria (customer-facing)**: Plain-English statements the
        customer will use to judge completion.

      - **Rough Estimates**: Feature-level estimates for quoting.

      > **Commercial gate:** customer commercial sign-off is required before
      > proceeding to design and spec.
    requires: []

  - id: design
    generates: design.md
    description: Technical design for the scoped deliverable
    template: design.md
    instruction: >
      Write the technical design after SOW is signed.

      Sections:

      - **Architecture Overview**: System layers, integration points, dependencies.

      - **Integration Points**: External APIs, webhooks, data sources.
        Include auth method, data format, known constraints.

      - **Data Model**: Core entities and key fields.

      - **Decisions**: Technical choices with rationale.

      - **Risk Register**: Known unknowns with likelihood, impact, mitigation.

      - **Change Request Triggers**: Scenarios that constitute out-of-scope work.
    requires:
      - proposal

  - id: specs
    generates: specs/**/*.md
    description: Gherkin specs that serve as both implementation guide and customer UAT tests
    template: spec.md
    instruction: >
      Write Gherkin specs that serve two purposes:
      1. Drive the implementation (agent reads during apply).
      2. Function as UAT acceptance tests the customer signs off on delivery.

      Rules:
      - Each scenario MUST be readable by the customer.
      - THEN steps describe outcomes the customer can observe.
      - Each scenario MUST map to a customer-facing acceptance criterion in the SOW.
      - Do not write scenarios for behaviour outside the SOW scope without flagging
        it as a change request.
    requires:
      - proposal
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation tasks grouped by deliverable
    template: tasks.md
    instruction: >
      Create the task list for the bespoke delivery.

      Rules:
      - Every SOW capability MUST have a task group.
      - Every Gherkin scenario MUST have a matching automated test task.
      - Flag tasks that depend on external input (customer data, credentials).
      - The final task group MUST be "Verification — Definition of Done" including:
        all tests green, build passing, CI green, customer UAT checklist ready.
      - Do NOT mark a test task complete unless the test actually exists and passes.
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read proposal.md (SOW) and engineering-guidelines.md (repo root) before starting.
    Implement in SOW scope order. After each capability: run build and tests.
    If a runtime error occurs: fix it, append one line to engineering-guidelines.md.
    Flag any scope-creep risk immediately rather than absorbing it silently.
