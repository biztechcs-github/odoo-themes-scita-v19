name: spec-driven-ui
version: 1
description: >
  Wireframe-first spec-driven flow for user-facing product features.
  Lifecycle: wireframe → proposal → design → specs → tasks.
  Use when building or changing any screen, interaction, or visible user flow.
  The spec is written against the signed-off wireframe — not before it.
artifacts:
  - id: wireframe
    generates: wireframe.md
    description: Wireframe analysis and screen-to-scenario mapping
    template: wireframe.md
    instruction: >
      Produce the wireframe analysis document before writing any proposal or spec.

      This document:
      1. Confirms the wireframe is signed off (attached to task or confirmed by BA).
      2. Catalogues every screen and interactive state shown in the wireframe.
      3. Maps each screen to the capability and Gherkin scenario it will produce.

      Sections:

      - **Wireframe Status**: Is the wireframe signed off by the BA and
        stakeholder/customer? If not, STOP — the spec cannot be written until it is.

      - **Screen Inventory**: Table listing every screen, modal, panel, or state
        visible in the wireframe. Include: screen ID (sc1, sc2…), screen name,
        user type who sees it, and the capability it belongs to.

      - **Scenario Mapping**: For each screen, describe the observable outcome
        in one sentence — this becomes the THEN clause of the Gherkin scenario.

      - **Open Questions**: Anything the wireframe leaves ambiguous that the spec
        must decide. Raise these before writing proposal.md.

      The spec MUST be written against this document. Any wireframe drift after
      sign-off must go through a new wireframe review — do not silently update spec.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Change proposal grounded in the signed-off wireframe
    template: proposal.md
    instruction: >
      Write the proposal document after the wireframe is signed off.

      The proposal describes WHAT changes and WHY, scoped to the UI
      behaviour shown in the wireframe.

      Sections:

      - **Why**: The user problem or business opportunity this UI addresses.

      - **What Changes**: Bullet list of new or changed screens and interactions,
        referencing the wireframe screen IDs (sc1, sc2…).

      - **Capabilities**: New or modified capabilities (kebab-case names).
        Each will become a `specs/<name>/spec.md`.

      - **Impact Scope** (MANDATORY — same as all schemas):
        Search the codebase for every controller, view, partial, shared component,
        or grid that this change affects. List every location in the Impact Scope
        table before writing any spec scenario.

      - **Wireframe reference**: State the wireframe file name and confirm it
        is the signed-off version attached to the Odoo task or repo.

      - **Out of Scope**: Explicitly list what is NOT in this change.
    requires:
      - wireframe

  - id: design
    generates: design.md
    description: Technical design — component architecture and data flow for the UI change
    template: design.md
    instruction: >
      Write the design document for the UI change.

      Focus on the component and data layer — not line-by-line implementation.

      Sections:

      - **Component Design**: Which components are new, changed, or reused?
        For each: what data does it need, what events does it emit?

      - **Data Flow**: How does data move from the backend to the UI and back?
        Include API calls, state management, and caching decisions.

      - **Shared Component Impact**: If the change touches a shared component
        (grid, form, panel, layout), list every other page/route that uses it
        and confirm the change is backward-compatible, or explain the migration.

      - **Decisions**: Key choices with rationale (e.g. client-side vs server-side
        rendering, component library choice, state management approach).

      - **Wireframe Deviations**: Any deliberate differences between the signed-off
        wireframe and the planned implementation. Each deviation must be noted
        with a reason — if none, state "None".
    requires:
      - proposal

  - id: specs
    generates: specs/**/*.md
    description: Gherkin-style specs written against the signed-off wireframe
    template: spec.md
    instruction: >
      Write spec files with Gherkin scenarios that directly describe the
      wireframe behaviour.

      Rules (same as spec-driven, plus UI-specific):
      - Each `#### Scenario` MUST reference the wireframe screen it covers
        (e.g., "Scenario: User saves design (sc3)").
      - THEN steps must describe observable UI outcomes (text appears, button
        state changes, navigation occurs) — not internal state.
      - If the wireframe shows an error state, validation message, or loading
        state, write a scenario for it.
      - Do not write scenarios for behaviour not shown in the wireframe without
        first flagging it as an Open Question.
    requires:
      - proposal
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation tasks ordered by component dependency
    template: tasks.md
    instruction: >
      Create the task list for the UI change.

      Order tasks: backend/API changes first, then shared components,
      then page-specific components, then integration tests, then DoD.

      Rules:
      - Every wireframe screen MUST have a task that implements it.
      - Every Gherkin scenario MUST have a matching test task (Playwright,
        xUnit, or equivalent).
      - If a shared component is changed, include tasks for every affected
        page/route listed in the Impact Scope.
      - The final task group MUST be "Verification — Definition of Done"
        with: all tests green, build passing, CI green, no TODO/mock in code.
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read wireframe.md and engineering-guidelines.md (repo root) before starting.
    Implement backend changes first, then shared components, then page components.
    After each task group: run build and all tests. Do not proceed until green.
    Append one line to engineering-guidelines.md for any runtime error fixed.
